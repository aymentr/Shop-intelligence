name: CI

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo

  integration:
    # PostgreSQL 16 integration tests against the same compose.yaml developers use.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - name: Bootstrap, migrate template, run integration tests (three independent passes)
        run: |
          for pass in 1 2 3; do
            echo "PostgreSQL acceptance pass ${pass}/3"
            npm run test:db || exit 1
          done
      - name: Targeted D5b mutant execution (expected regression failure)
        run: node tests/mutations/step2-d5b.mjs
      - name: Targeted role-bootstrap mutant execution (expected regression failure)
        run: node tests/mutations/step2-roles.mjs
      - name: Targeted T1 idempotency mutant execution (expected regression failure)
        run: node tests/mutations/step2-idempotency.mjs
      - name: M5 isolation mutant (must be killed)
        run: node tests/mutations/step2-isolation.mjs
      - name: M4 attempt-limit mutant (must be killed)
        run: node tests/mutations/step2-attempt-cap.mjs
      - name: M1 source-row-lock mutant (must be killed)
        run: node tests/mutations/step2-source-lock.mjs
      - name: M2 rights and source-controls mutants (must be killed)
        run: node tests/mutations/step2-rights-controls.mjs
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v
