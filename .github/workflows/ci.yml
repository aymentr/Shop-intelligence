name: CI

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo

  integration:
    # PostgreSQL 16 integration tests against the same compose.yaml developers use.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - name: Bootstrap, migrate template, run integration tests (three independent passes)
        run: |
          for pass in 1 2 3; do
            echo "PostgreSQL acceptance pass ${pass}/3"
            npm run test:db || exit 1
          done
      - name: Crash durability of read intents (AUD-12a, crash-detected mutants, INT-19; restarts PostgreSQL)
        run: node tests/db/run.mjs tests/crash/m3-durability-crash.test.mjs tests/crash/m3-durability-fixtures.test.mjs tests/crash/m4-status-durability.test.mjs
      - name: Targeted D5b mutant execution (expected regression failure)
        run: node tests/mutations/step2-d5b.mjs
      - name: Targeted role-bootstrap mutant execution (expected regression failure)
        run: node tests/mutations/step2-roles.mjs
      - name: Targeted T1 idempotency mutant execution (expected regression failure)
        run: node tests/mutations/step2-idempotency.mjs
      - name: M5 isolation mutant (must be killed)
        run: node tests/mutations/step2-isolation.mjs
      - name: M4 attempt-limit mutant (must be killed)
        run: node tests/mutations/step2-attempt-cap.mjs
      - name: M1 source-row-lock mutant (must be killed)
        run: node tests/mutations/step2-source-lock.mjs
      - name: M2 rights and source-controls mutants (must be killed)
        run: node tests/mutations/step2-rights-controls.mjs
      - name: M3 lease and expiry mutants (must be killed)
        run: node tests/mutations/step2-lease.mjs
      - name: M6 privilege-boundary mutants (must be killed)
        run: node tests/mutations/step2-privilege-boundary.mjs
      - name: D7 production-gate mutant (must be killed)
        run: node tests/mutations/p3b-production-gate.mjs
      - name: DR-1 independent clean-cluster restore (mandatory)
        run: bash tests/restore/clean-cluster.sh
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v

  lifecycle-demo:
    # M3-P3D: the complete synthetic evidence lifecycle against a fresh disposable PostgreSQL 16.15
    # container, three independent times (matrix), plus the demonstration's own negative controls.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Synthetic lifecycle demonstration (fresh disposable database, real-deadline scenario included)
        run: DEMO_REPORT="$RUNNER_TEMP/demo-report-${{ matrix.run }}.json" bash demo/run.sh
      - name: Demonstration negative controls (grant, retention, verdict checks disabled; must fail)
        if: matrix.run == 1
        run: bash demo/run-mutants.sh
      - name: Synthetic advertiser intelligence demonstration (M4-P1; synthetic data, not live market conditions)
        if: matrix.run == 1
        run: DEMO_PROGRAM=demo/intelligence.mjs DEMO_REPORT="$RUNNER_TEMP/intelligence-report.json" bash demo/run.sh
      - name: Content-free demonstration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.run }}
          path: ${{ runner.temp }}/demo-report-${{ matrix.run }}.json
          if-no-files-found: warn

  slow-deadline:
    # Real rights deadlines (about 8 minutes) and a server with commit timestamps disabled (M3-P3B).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run build
      - name: Real-deadline verification and expiry retention (VR-2, VR-3, RT-15, window mutant)
        run: node tests/db/run.mjs tests/slow/m3-deadline.test.mjs
      - name: Disabled commit timestamps (VR-12)
        run: bash tests/slow/commit-ts-off.sh
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v
