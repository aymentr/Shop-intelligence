name: CI

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo

  integration:
    # PostgreSQL 16 integration tests against the same compose.yaml developers use.
    # 40 min: M4-P3.0 adds the readability equivalence suite (about 3 min per pass, three passes).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - name: Bootstrap, migrate template, run integration tests (three independent passes)
        run: |
          for pass in 1 2 3; do
            echo "PostgreSQL acceptance pass ${pass}/3"
            npm run test:db || exit 1
          done
      - name: Deployment verification — evidence-reference integrity gate and FK_AUDIT on the migrated template (zero rows each)
        run: |
          gate=$(docker compose exec -T -e PGPASSWORD=local-test-only db psql -X -v ON_ERROR_STOP=1 -At -h 127.0.0.1 -U si_bootstrap -d si_template_test < db/ops/integrity-gate.sql)
          [ -z "$gate" ] || { echo "integrity gate FAILED:"; echo "$gate"; exit 1; }
          audit=$(docker compose exec -T -e PGPASSWORD=local-test-only db psql -X -v ON_ERROR_STOP=1 -At -h 127.0.0.1 -U si_bootstrap -d si_template_test < db/ops/fk-audit.sql)
          [ -z "$audit" ] || { echo "FK_AUDIT FAILED:"; echo "$audit"; exit 1; }
          echo "integrity gate PASS, FK_AUDIT PASS"
      - name: Deployment verification — schema readiness of the 0022 index (db/ops/readiness.sql; zero rows; not an integrity check)
        run: |
          ready=$(docker compose exec -T -e PGPASSWORD=local-test-only db psql -X -v ON_ERROR_STOP=1 -At -h 127.0.0.1 -U si_bootstrap -d si_template_test < db/ops/readiness.sql)
          [ -z "$ready" ] || { echo "readiness FAILED:"; echo "$ready"; exit 1; }
          echo "readiness PASS"
      - name: Crash durability of read intents (AUD-12a, crash-detected mutants, INT-19) and of the concurrent 0022 build (MIG-C1, MIG-C2); restarts PostgreSQL
        run: node tests/db/run.mjs tests/crash/m3-durability-crash.test.mjs tests/crash/m3-durability-fixtures.test.mjs tests/crash/m4-status-durability.test.mjs tests/crash/m3-r35-durability.test.mjs tests/crash/m4-adopt-crash.test.mjs
      - name: Targeted D5b mutant execution (expected regression failure)
        run: node tests/mutations/step2-d5b.mjs
      - name: Targeted role-bootstrap mutant execution (expected regression failure)
        run: node tests/mutations/step2-roles.mjs
      - name: Targeted T1 idempotency mutant execution (expected regression failure)
        run: node tests/mutations/step2-idempotency.mjs
      - name: M5 isolation mutant (must be killed)
        run: node tests/mutations/step2-isolation.mjs
      - name: M4 attempt-limit mutant (must be killed)
        run: node tests/mutations/step2-attempt-cap.mjs
      - name: M1 source-row-lock mutant (must be killed)
        run: node tests/mutations/step2-source-lock.mjs
      - name: M2 rights and source-controls mutants (must be killed)
        run: node tests/mutations/step2-rights-controls.mjs
      - name: M3 lease and expiry mutants (must be killed)
        run: node tests/mutations/step2-lease.mjs
      - name: M6 privilege-boundary mutants (must be killed)
        run: node tests/mutations/step2-privilege-boundary.mjs
      - name: D7 production-gate mutant (must be killed)
        run: node tests/mutations/p3b-production-gate.mjs
      - name: DR-1 independent clean-cluster restore (mandatory)
        run: bash tests/restore/clean-cluster.sh
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v

  lifecycle-demo:
    # M3-P3D: the complete synthetic evidence lifecycle against a fresh disposable PostgreSQL 16.15
    # container, three independent times (matrix), plus the demonstration's own negative controls.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Synthetic lifecycle demonstration (fresh disposable database, real-deadline scenario included)
        run: DEMO_REPORT="$RUNNER_TEMP/demo-report-${{ matrix.run }}.json" bash demo/run.sh
      - name: Demonstration negative controls (grant, retention, verdict checks disabled; must fail)
        if: matrix.run == 1
        run: bash demo/run-mutants.sh
      - name: Synthetic advertiser intelligence demonstration (M4-P1; synthetic data, not live market conditions)
        if: matrix.run == 1
        run: DEMO_PROGRAM=demo/intelligence.mjs DEMO_REPORT="$RUNNER_TEMP/intelligence-report.json" bash demo/run.sh
      - name: Content-free demonstration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.run }}
          path: ${{ runner.temp }}/demo-report-${{ matrix.run }}.json
          if-no-files-found: warn

  slow-deadline:
    # Real rights deadlines (about 8 minutes) and a server with commit timestamps disabled (M3-P3B), and the M4-P2.1 scale workload.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run build
      - name: Real-deadline verification and expiry retention (VR-2, VR-3, RT-15, window mutant)
        run: node tests/db/run.mjs tests/slow/m3-deadline.test.mjs
      - name: Rights version taking effect during a scan (M4-P1.2 R2; real 64 s schedule, plus the version-in-effect mutant)
        run: node tests/db/run.mjs tests/slow/m4-scheduled-version.test.mjs
      - name: Server-side intelligence at the candidate cap (M4-P2.1 D2/D3; 200,000 observations)
        run: node tests/db/run.mjs tests/slow/m4-remediation-scale.test.mjs
      - name: Concentrated history on a database without planner statistics (M4-P2.2 N1; 200,000 observations, plus the 0015 mutant)
        run: node tests/db/run.mjs tests/slow/m4-cold-scale.test.mjs
      - name: Set-based readability at 10,000 runs, cold and warm (M4-P3.0; p95 targets, plus the 0016 per-run path measured)
        run: SI_BENCH_RUNS=10000 SI_BENCH_ORIG_N=3 node tests/db/run.mjs tests/slow/m4-readability-bench.test.mjs
      - name: Advertiser summaries cost (M4-P3.1; 50,000 observations and 30,000 new identities; no temporary files)
        run: SI_SB_LAYOUTS=obs50k,ids100kq node tests/db/run.mjs tests/slow/m4-summaries-bench.test.mjs
      - name: Disabled commit timestamps (VR-12)
        run: bash tests/slow/commit-ts-off.sh
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v

  summary-close:
    # M4-P3.1-CLOSE-01: eligibility cost at 30,000 runs (C1) and the 0020/0021 file-level mutation campaign (C2).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run build
      - name: Summary eligibility cost at 30,000 runs (C1 reference environment; >= 100 calls; warm p95 <= 15 ms, cold p95 <= 40 ms asserted)
        run: SI_CB_REFERENCE=1 SI_CB_N=100 node tests/db/run.mjs tests/slow/m4-coverage-bench.test.mjs
      - name: Summary mutation campaign MX1-MX17 (C2; every non-equivalent mutant killed by its detector; files restored)
        run: CI=true node tests/mutations/m4-p31-close.mjs
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v

  purge-latency:
    # M4-P3.1-RT13-01 (migration 0022): emergency-control latency against a maximum purge batch under contention, cold and
    # warm statistics (p95 <= 5 s, unchanged RT-13 / M3-T14 bound; structural O(rows) bound), and the deliberate break.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run build
      - name: Purge latency p50/p95 under contention (cold and warm statistics; 10 iterations each)
        run: SI_RT13_N=10 node tests/db/run.mjs tests/slow/m4-rt13-purge-bench.test.mjs
      - name: Purge latency without the 0022 index (report only; the "before" numbers)
        run: SI_RT13_BROKEN=1 SI_RT13_N=3 SI_RT13_MODES=cold node tests/db/run.mjs tests/slow/m4-rt13-purge-bench.test.mjs
      - name: Deliberate break of 0022 (RTX1, RTX2 killed by PF-1 cold; file restored)
        run: CI=true node tests/mutations/m4-rt13-purge-fk.mjs
      - name: Deliberate breaks of the deterministic test barriers (BX1-BX3; R-43, R-44; file restored)
        run: CI=true node tests/mutations/m4-test-barriers.mjs
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v

  summary-search:
    # M4-P3.2 (migration 0023): complete summary-backed search and history requests at 1,000 / 10,000 / 30,000 runs, before
    # (0018) and after (0023, summary path and forced fallback), cold, warm and under publication and purge; and the SSX campaign.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run build
      - name: Summary-backed reader requests at 1,000 / 10,000 / 30,000 runs (identical pages or refusals on 0018, 0023 summary and 0023 fallback; >= 2x faster; fixed-cost p95 <= 100 / 400 ms)
        run: SI_SSB_RUNS=1000,10000,30000 node tests/db/run.mjs tests/slow/m4-summary-search-bench.test.mjs
      - name: Summary-search mutation campaign SSX1-SSX11 (unsafe fallback, authorization, distinct union, stale readability, ...; file restored)
        run: CI=true node tests/mutations/m4-p32-search.mjs
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v

  populated-adoption:
    # M4-P3.3 Phase 1 (R-42, R-45): populated adoption of 0022 (CREATE INDEX CONCURRENTLY outside a transaction, then
    # `adopt` under the migrator lock) rehearsed at 1,000,000 observations with a concurrent writer, a cancelled build and
    # its recovery; and the deliberate breaks of the readiness gate and the adoption procedure.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL 16 (localhost only)
        run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run build
      - name: Populated adoption rehearsal (1,000,000 observations; writer never in a lock wait during the concurrent build)
        run: SI_ADOPT_ROWS=1000000 node tests/db/run.mjs tests/slow/m4-adopt-rehearsal.test.mjs
      - name: Readiness and adoption deliberate breaks (RX1-RX5, AX1-AX4; files restored)
        run: CI=true node tests/mutations/m4-p33-p1.mjs
      - name: Database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down -v
